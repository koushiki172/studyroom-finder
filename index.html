<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Seat to Study – Live demo</title>
<style>
:root{--bg:#EEF5F3;--panel:#FFFFFF;--ink:#10292B;--muted:#55696A;--teal:#0E5C57;--amber:#F2A33A;--line:#D3E0DD;--ok:#2E7D6B;--okbg:#DDF1EA;--warn:#B7791F;--warnbg:#FDF1D8;--bad:#C0432F;--badbg:#FBE3DE;--head:#10292B;--headink:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A1B;--panel:#13292B;--ink:#EAF3F1;--muted:#9DB5B2;--teal:#5FA89E;--line:#26423F;--okbg:#17372F;--warnbg:#3A2E14;--badbg:#3C1F19;--ok:#6CCBA6;--warn:#F2C26B;--bad:#F08A78;--head:#0B1A1B}}
:root[data-theme="dark"]{--bg:#0B1A1B;--panel:#13292B;--ink:#EAF3F1;--muted:#9DB5B2;--teal:#5FA89E;--line:#26423F;--okbg:#17372F;--warnbg:#3A2E14;--badbg:#3C1F19;--ok:#6CCBA6;--warn:#F2C26B;--bad:#F08A78;--head:#0B1A1B}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:24px 16px}
.side{width:280px;max-width:100%}
.side h1{font-family:Cambria,Georgia,serif;font-size:26px;margin:4px 0 6px}
.side p{color:var(--muted);margin:0 0 16px;line-height:1.4}
.jump{display:grid;gap:8px}
.jump button{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:15px}
.jump button.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.jump b{background:var(--amber);color:#10292B;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px;flex:none}
.task{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.45}
.task strong{color:var(--teal)}
.phone{width:360px;max-width:100%;height:700px;background:var(--panel);border:8px solid #10292B;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.top{background:var(--head);color:var(--headink);padding:16px 18px 12px}
.top .t{font-family:Cambria,Georgia,serif;font-size:19px;font-weight:700}
.top .s{font-size:12px;opacity:.8;margin-top:2px}
.body{flex:1;overflow-y:auto;padding:16px 16px 12px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
.nav button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 0 12px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--teal);font-weight:700}
.nav i{display:block;font-style:normal;font-size:17px;margin-bottom:2px}
h2{font-size:15px;margin:0 0 10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;color:var(--ink);font:inherit}
.opt.on{border-color:var(--teal)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none}
.opt.on .dot{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,transparent 50%)}
.opt small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;margin:2px 0 14px}
.chips button{font:inherit;cursor:pointer;flex:1;padding:8px 0;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.cta{font:inherit;font-weight:700;cursor:pointer;width:100%;padding:13px;border-radius:12px;border:0;background:var(--head);color:var(--headink);margin-top:6px}
.cta.alt{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.item{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-size:16px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--teal)}
.st{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:6px}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.fac{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.fac span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.sec{margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.note{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{background:var(--okbg);color:var(--ok);font-weight:700;border-radius:12px;padding:12px;margin-top:10px}
svg text{font-family:Calibri,Arial,sans-serif}
</style>
</head>
<body>
<aside class="side">
  <h1>A Seat to Study</h1>
  <p>Clickable prototype of the six final screens. Tap inside the phone, or jump to any screen below.</p>
  <div class="jump" id="jump"></div>
  <div class="task"><strong>Demo path:</strong> Home → choose “Quiet study” → Library – Floor 2 → View on campus map. Then go back and try “Group study” → Request this table, and finally Report a problem.</div>
</aside>
<main class="phone" id="phone" aria-live="polite"></main>

<script>
(function(){
var NAMES=[["home","Home"],["quiet","Quiet spaces"],["details","Space details"],["map","Campus map"],["group","Group spaces"],["report","Report a problem"]];
var SPACES={
 rr:{name:"Reading Room",avail:"Available",lv:"ok",fac:["Charging sockets","Seats"],rules:"Silent study only",route:"Library entrance → Reading Room"},
 l2:{name:"Library – Floor 2",avail:"Few seats left",lv:"warn",fac:["Charging sockets","Seats"],rules:"Silent study only",route:"Library entrance → L2"},
 b34:{name:"Block 34 Study Area",avail:"Full",lv:"bad",fac:["Seats"],rules:"Quiet zone, no phone calls",route:"Block 34 main door → study area"}
};
var GROUPS=[
 {id:"a",name:"Group Table A",seats:4,avail:"Available",lv:"ok",fac:["Table","Charging"]},
 {id:"b",name:"Group Table B",seats:6,avail:"Few seats left",lv:"warn",fac:["Table","Charging"]}
];
var S={screen:"home",need:"quiet",size:4,space:"l2",sent:"",reported:false,rsp:"l2",rtype:"Noise"};
var phone=document.getElementById("phone");
function go(n){S.screen=n;S.sent="";S.reported=false;draw();}
function pill(x){return '<span class="st '+x.lv+'">'+x.avail+'</span>';}
function fac(a){return '<div class="fac">'+a.map(function(f){return '<span>'+(f.indexOf("Charg")===0?"⚡ ":"")+f+'</span>';}).join("")+'</div>';}
var VIEWS={
home:function(){
 var o=[["quiet","Quiet study","Solo, focused"],["group","Group study","Discussion allowed"],["either","Either / not sure","Show me everything"]];
 var h='<h2>What do you need right now?</h2>'+o.map(function(a){return '<button class="opt'+(S.need===a[0]?' on':'')+'" data-need="'+a[0]+'"><span class="dot"></span><span><b>'+a[1]+'</b><small>'+a[2]+'</small></span></button>';}).join("");
 if(S.need==="group"||S.need==="either"){h+='<div class="sec">GROUP SIZE</div><div class="chips">'+[2,3,4,5].map(function(n){return '<button data-size="'+n+'" class="'+(S.size===n?'on':'')+'">'+(n===5?'5+':n)+'</button>';}).join("")+'</div>';}
 return {t:"A Seat to Study",s:"Find the right study space",b:h+'<button class="cta" data-act="find">Find suitable spaces</button>'};
},
quiet:function(){
 var h=Object.keys(SPACES).map(function(k){var p=SPACES[k];return '<button class="item" data-space="'+k+'"><div class="r"><b>'+p.name+'</b><span>›</span></div><div class="tag">QUIET</div>'+pill(p)+fac(p.fac)+'</button>';}).join("");
 return {t:"Quiet spaces",s:"Status shown as text and colour",b:h};
},
details:function(){
 var p=SPACES[S.space];
 return {t:p.name,s:"Quiet zone",b:'<div class="sec">ZONE</div><b>QUIET</b><div class="sec">AVAILABILITY</div>'+pill(p)+'<div class="sec">FACILITIES</div>'+fac(p.fac)+'<div class="sec">RULES</div>'+p.rules+
  '<button class="cta" data-go="report" style="margin-top:18px">Report a problem</button><button class="cta alt" data-go="map">View on campus map</button>'};
},
map:function(){
 var p=SPACES[S.space];var sel=S.space;
 function blk(id,x,y,w,h,l){var on=(id===sel);return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="'+(on?'var(--teal)':'var(--bg)')+'" stroke="var(--line)" stroke-width="1.5"/><text x="'+(x+w/2)+'" y="'+(y+h/2+4)+'" text-anchor="middle" font-size="12" fill="'+(on?'#fff':'var(--ink)')+'">'+l+'</text>';}
 var px={rr:[95,102],l2:[95,70],b34:[240,110]}[sel];
 var svg='<svg viewBox="0 0 320 250" width="100%" role="img" aria-label="Campus map"><rect width="320" height="250" rx="12" fill="var(--panel)" stroke="var(--line)"/>'+blk("l2",20,20,150,60,"Library")+blk("rr",20,100,150,50,"Reading Room")+blk("b34",190,90,110,60,"Block 34")+
  '<rect x="190" y="170" width="110" height="55" rx="8" fill="var(--bg)" stroke="var(--line)"/><text x="245" y="202" text-anchor="middle" font-size="12" fill="var(--ink)">Robo Park</text>'+
  '<rect x="20" y="170" width="150" height="55" rx="8" fill="var(--bg)" stroke="var(--line)"/><text x="95" y="202" text-anchor="middle" font-size="12" fill="var(--ink)">Block 26 tables</text>'+
  '<path d="M60 160 L60 '+(px[1]+8)+' L'+px[0]+' '+(px[1]+8)+'" fill="none" stroke="#F2A33A" stroke-width="3" stroke-dasharray="6 5"/><circle cx="60" cy="160" r="6" fill="#10292B"/><circle cx="'+px[0]+'" cy="'+(px[1]+8)+'" r="8" fill="#F2A33A" stroke="#10292B" stroke-width="2"/></svg>';
 return {t:"Campus map",s:"Selected: "+p.name,b:svg+'<div class="sec">ROUTE</div>'+p.route+'<div class="sec">LANDMARK</div>Study-space marker'+(S.sent==="route"?'<div class="toast">Route started – follow the dashed line.</div>':'')+'<button class="cta" data-act="route" style="margin-top:14px">Start route</button>'};
},
group:function(){
 var h=GROUPS.map(function(g){return '<div class="item"><div class="r"><b>'+g.name+'</b><b>Seats '+g.seats+'</b></div><div class="tag">DISCUSSION</div>'+pill(g)+fac(g.fac)+'<button class="cta" data-req="'+g.id+'" style="margin-top:10px">Request this table</button>'+(S.sent===g.id?'<div class="toast">Request sent for '+g.name+'. Not a confirmed booking yet.</div>':'')+'</div>';}).join("");
 return {t:"Group spaces",s:"Capacity shown for every table",b:h+'<div class="note"><b>Request ≠ automatic booking.</b> Staff or students confirm availability.</div>'};
},
report:function(){
 var opts=Object.keys(SPACES).map(function(k){return '<option value="'+k+'"'+(S.rsp===k?' selected':'')+'>'+SPACES[k].name+'</option>';}).join("");
 var types=["Noise","Area full","Other"].map(function(t){return '<button class="opt'+(S.rtype===t?' on':'')+'" data-rtype="'+t+'" style="padding:8px 12px;margin-bottom:6px"><span class="dot"></span><b>'+t+'</b></button>';}).join("");
 return {t:"Report a problem",s:"Keeps information current for everyone",b:'<div class="sec">CURRENT SPACE</div><select id="rsp">'+opts+'</select><div class="sec">PROBLEM</div>'+types+'<div class="sec">DETAILS</div><textarea rows="3" placeholder="Describe the issue"></textarea><button class="cta" data-act="submit" style="margin-top:12px">Submit report</button>'+(S.reported?'<div class="toast">Thanks – your report was sent.</div>':'')}
}};
function draw(){
 var v=VIEWS[S.screen]();
 var navs=[["home","⌂","Home"],["quiet","▤","Spaces"],["map","⌖","Map"],["report","⚑","Report"]];
 var navOn={home:"home",quiet:"quiet",details:"quiet",group:"quiet",map:"map",report:"report"}[S.screen];
 phone.innerHTML='<div class="top"><div class="t">'+v.t+'</div><div class="s">'+v.s+'</div></div><div class="body">'+v.b+'</div><nav class="nav">'+navs.map(function(n){return '<button data-go="'+n[0]+'" class="'+(navOn===n[0]?'on':'')+'"><i>'+n[1]+'</i>'+n[2]+'</button>';}).join("")+'</nav>';
 document.getElementById("jump").innerHTML=NAMES.map(function(n,i){return '<button data-go="'+n[0]+'" class="'+(S.screen===n[0]?'on':'')+'"><b>'+(i+1)+'</b>'+n[1]+'</button>';}).join("");
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-go],[data-need],[data-size],[data-space],[data-act],[data-req],[data-rtype]");if(!t)return;
 var d=t.dataset;
 if(d.go){go(d.go);return;}
 if(d.need){S.need=d.need;draw();return;}
 if(d.size){S.size=+d.size;draw();return;}
 if(d.space){S.space=d.space;S.rsp=d.space;go("details");return;}
 if(d.rtype){S.rtype=d.rtype;draw();return;}
 if(d.req){S.sent=d.req;draw();return;}
 if(d.act==="find"){go(S.need==="group"?"group":"quiet");return;}
 if(d.act==="route"){S.sent="route";draw();return;}
 if(d.act==="submit"){S.reported=true;draw();return;}
});
document.addEventListener("change",function(e){if(e.target.id==="rsp"){S.rsp=e.target.value;}});
draw();
})();
</script>
</body>
</html>
